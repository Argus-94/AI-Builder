# Root stub for Cloud Build Engine (Expo). Real properties live in android/
# after prebuild; withFixGradleProperties + this shim keep CI happy.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false

# BuildConfig generation for AGP 8+ compatibility
android.defaults.buildfeatures.buildconfig=true

# Preserve transitive dependency resources through generated R classes.
android.nonTransitiveRClass=false

# Preserve final R.id constants for legacy Java switch/case compatibility.
android.nonFinalResIds=false

# Disable incremental Kotlin compiler to prevent stale cache issues
kotlin.incremental=false
